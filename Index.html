<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Parkour 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

.ui{
    position:fixed;
    top:20px;
    left:20px;
    z-index:10;
    color:white;
}

.title{
    font-size:35px;
    font-weight:bold;
    color:#00ffff;
    text-shadow:0 0 20px #00ffff;
}

.menu{
    margin-top:20px;
    display:flex;
    gap:10px;
}

.btn{
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:white;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.5);
}

.btn:hover{
    transform:scale(1.08);
    background:#00ffff;
    color:black;
}
</style>
</head>

<body>

<div class="ui">
    <div class="title">NEON PARKOUR 3D</div>

    <div class="menu">
        <button class="btn">PLAY</button>
        <button class="btn">SHOP</button>
        <button class="btn">VIP</button>
    </div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000,0.015);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,5,15);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);

const light = new THREE.DirectionalLight(0x00ffff,2);

light.position.set(10,20,10);

light.castShadow = true;

scene.add(light);

const floorGeo = new THREE.BoxGeometry(100,1,100);

const floorMat = new THREE.MeshStandardMaterial({
color:0x050505,
metalness:1,
roughness:0.1
});

const floor = new THREE.Mesh(floorGeo,floorMat);

floor.receiveShadow = true;

floor.position.y = -2;

scene.add(floor);

function createPlatform(x,y,z,color){

    const geo = new THREE.BoxGeometry(6,1,6);

    const mat = new THREE.MeshStandardMaterial({
        color:color,
        emissive:color,
        emissiveIntensity:1,
        metalness:1,
        roughness:0.2
    });

    const platform = new THREE.Mesh(geo,mat);

    platform.position.set(x,y,z);

    platform.castShadow = true;

    platform.receiveShadow = true;

    scene.add(platform);

    return platform;
}

for(let i=0;i<30;i++){

    createPlatform(
        Math.random()*80-40,
        Math.random()*15,
        Math.random()*80-40,
        new THREE.Color(
            Math.random(),
            Math.random(),
            Math.random()
        )
    );

}

const towerGeo = new THREE.CylinderGeometry(2,2,30,32);

const towerMat = new THREE.MeshStandardMaterial({
    color:0x00ffff,
    emissive:0x00ffff,
    emissiveIntensity:1
});

const tower = new THREE.Mesh(towerGeo,towerMat);

tower.position.set(0,13,-40);

tower.castShadow = true;

scene.add(tower);

function createLaser(x,y,z){

    const geo = new THREE.BoxGeometry(20,0.2,0.2);

    const mat = new THREE.MeshBasicMaterial({
        color:0xff0000
    });

    const laser = new THREE.Mesh(geo,mat);

    laser.position.set(x,y,z);

    scene.add(laser);

    return laser;
}

const lasers = [];

for(let i=0;i<8;i++){

    lasers.push(
        createLaser(
            Math.random()*50-25,
            Math.random()*10,
            Math.random()*50-25
        )
    );

}

const starsGeometry = new THREE.BufferGeometry();

const starsCount = 5000;

const posArray = new Float32Array(starsCount * 3);

for(let i=0;i<starsCount*3;i++){

    posArray[i] = (Math.random()-0.5)*500;

}

starsGeometry.setAttribute(
'position',
new THREE.BufferAttribute(posArray,3)
);

const starsMaterial = new THREE.PointsMaterial({
size:0.2,
color:0xffffff
});

const starsMesh = new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(starsMesh);

function animate(){

    requestAnimationFrame(animate);

    tower.rotation.y += 0.01;

    lasers.forEach((laser,index)=>{
        laser.rotation.z += 0.02 + index * 0.001;
    });

    scene.rotation.y += 0.0005;

    renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
