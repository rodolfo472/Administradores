<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serjão Bot</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  text-align: center;
}

header {
  padding: 40px;
}

h1 {
  font-size: 40px;
}

button {
  background: #5865F2;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #4752C4;
}

section {
  margin-top: 50px;
}

.card {
  background: #1a1a1a;
  padding: 20px;
  margin: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Serjão Bot</h1>
  <p>Seu bot simples e poderoso!</p>

  <button onclick="window.open('https://discord.com/oauth2/authorize?client_id=1448662200284614767&scope=bot%20applications.commands&permissions=0')">
    ➕ Adicionar no Discord
  </button>
</header>

<section>
  <h2>📜 Comandos</h2>

  <div class="card">
    <b>s!embed</b>
    <p>Cria mensagens personalizadas</p>
  </div>

  <div class="card">
    <b>s!horas</b>
    <p>Mostra o horário atual</p>
  </div>

  <div class="card">
    <b>s!ping</b>
    <p>Verifica se o bot está online</p>
  </div>

</section>

</body>
</html>
