<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Parkour 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

/* MENU */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    z-index:10;
}

.title{
    font-size:45px;
    color:#00ffff;
    text-shadow:0 0 20px #00ffff;
    margin-bottom:20px;
}

.btn{
    width:220px;
    padding:16px;
    border:none;
    border-radius:20px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.5);
}

.btn:hover{
    transform:scale(1.05);
    background:#00ffff;
    color:black;
}

/* HUD */

#hud{
    position:absolute;
    inset:0;
    display:none;
    pointer-events:none;
}

/* JOYSTICK */

#joystickBase{
    position:absolute;
    left:30px;
    bottom:30px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:2px solid #00ffff;
    pointer-events:auto;
}

#joystick{
    position:absolute;
    left:35px;
    top:35px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#00ffff;
    box-shadow:0 0 20px #00ffff;
}

/* JUMP BUTTON */

#jumpBtn{
    position:absolute;
    right:40px;
    bottom:40px;
    width:100px;
    height:100px;
    border-radius:50%;
    border:none;
    background:#ff00ff;
    color:white;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 0 20px #ff00ff;
    pointer-events:auto;
}

/* SHOP */

#shop{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:300px;
    padding:20px;
    border-radius:20px;
    background:rgba(0,0,0,0.8);
    border:2px solid #00ffff;
    display:none;
    z-index:20;
    color:white;
}

.shopItem{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
}

.closeBtn{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:15px;
    background:#00ffff;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <div class="title">NEON PARKOUR 3D</div>

    <button class="btn" id="playBtn">PLAY</button>
    <button class="btn" id="shopBtn">SHOP</button>
    <button class="btn" id="vipBtn">VIP</button>

</div>

<!-- SHOP -->

<div id="shop">

    <h2>🛒 SHOP</h2>

    <div class="shopItem">
        Neon Trail - 100 Coins
    </div>

    <div class="shopItem">
        VIP Wings - 300 Coins
    </div>

    <div class="shopItem">
        Speed Boost - 200 Coins
    </div>

    <button class="closeBtn" id="closeShop">
        CLOSE
    </button>

</div>

<!-- HUD -->

<div id="hud">

    <div id="joystickBase">
        <div id="joystick"></div>
    </div>

    <button id="jumpBtn">↑</button>

</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

/* SCENE */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000,0.015);

/* CAMERA */

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,3,8);

/* RENDER */

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

/* LIGHTS */

const ambient = new THREE.AmbientLight(0xffffff,0.6);

scene.add(ambient);

const light = new THREE.DirectionalLight(0x00ffff,2);

light.position.set(10,20,10);

light.castShadow = true;

scene.add(light);

/* FLOOR */

const floorGeo = new THREE.BoxGeometry(200,1,200);

const floorMat = new THREE.MeshStandardMaterial({
color:0x050505,
metalness:1,
roughness:0.1
});

const floor = new THREE.Mesh(floorGeo,floorMat);

floor.receiveShadow = true;

floor.position.y = -2;

scene.add(floor);

/* PLAYER */

const playerGeo = new THREE.BoxGeometry(1,2,1);

const playerMat = new THREE.MeshStandardMaterial({
color:0x00ffff,
emissive:0x00ffff,
emissiveIntensity:1
});

const player = new THREE.Mesh(playerGeo,playerMat);

player.position.y = 0;

player.castShadow = true;

scene.add(player);

/* PLATFORMS */

function createPlatform(x,y,z,color){

    const geo = new THREE.BoxGeometry(6,1,6);

    const mat = new THREE.MeshStandardMaterial({
        color:color,
        emissive:color,
        emissiveIntensity:1
    });

    const mesh = new THREE.Mesh(geo,mat);

    mesh.position.set(x,y,z);

    mesh.castShadow = true;

    scene.add(mesh);

}

for(let i=0;i<30;i++){

    createPlatform(
        Math.random()*80-40,
        Math.random()*15,
        Math.random()*80-40,
        new THREE.Color(
            Math.random(),
            Math.random(),
            Math.random()
        )
    );

}

/* MENU BUTTONS */

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");

document.getElementById("playBtn").onclick = ()=>{

    menu.style.display = "none";

    hud.style.display = "block";

};

document.getElementById("shopBtn").onclick = ()=>{

    document.getElementById("shop").style.display = "block";

};

document.getElementById("closeShop").onclick = ()=>{

    document.getElementById("shop").style.display = "none";

};

document.getElementById("vipBtn").onclick = ()=>{

    alert("VIP COMING SOON");

};

/* JOYSTICK */

let moveX = 0;
let moveZ = 0;

const joystick = document.getElementById("joystick");
const base = document.getElementById("joystickBase");

base.addEventListener("touchmove",(e)=>{

    const touch = e.touches[0];

    const rect = base.getBoundingClientRect();

    const x = touch.clientX - rect.left - 65;
    const y = touch.clientY - rect.top - 65;

    moveX = x * 0.03;
    moveZ = y * 0.03;

    joystick.style.left = (x + 35) + "px";
    joystick.style.top = (y + 35) + "px";

});

base.addEventListener("touchend",()=>{

    moveX = 0;
    moveZ = 0;

    joystick.style.left = "35px";
    joystick.style.top = "35px";

});

/* JUMP */

let velocityY = 0;
let grounded = true;

document.getElementById("jumpBtn").onclick = ()=>{

    if(grounded){

        velocityY = 0.25;

        grounded = false;

    }

};

/* CAMERA FOLLOW */

function updateCamera(){

    camera.position.x = player.position.x;

    camera.position.z = player.position.z + 8;

    camera.position.y = player.position.y + 4;

    camera.lookAt(player.position);

}

/* ANIMATE */

function animate(){

    requestAnimationFrame(animate);

    /* MOVE */

    player.position.x += moveX * 0.1;

    player.position.z += moveZ * 0.1;

    /* GRAVITY */

    velocityY -= 0.01;

    player.position.y += velocityY;

    if(player.position.y <= 0){

        player.position.y = 0;

        velocityY = 0;

        grounded = true;

    }

    updateCamera();

    renderer.render(scene,camera);

}

animate();

/* RESIZE */

window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
